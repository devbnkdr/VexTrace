name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: System packages
        run: >-
          sudo apt-get update && sudo apt-get install -y potrace
          libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install vtracer pillow PyQt6 pytest ruff==0.16.8
      - run: ruff check .
      - run: bash -n install.sh uninstall.sh
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: CLI smoke test
        run: |
          python vextrace.py --version
          python vextrace.py assets/samples/mountains.png -o sample.svg --preset logo
          python vextrace.py assets/samples/mountains.png -o sample-bw.svg --mode potrace
          python vextrace.py assets/samples/mountains.png -o sample-shape.svg --mode silhouette
          python vextrace.py assets/samples/mountains.png -o sample-lines.svg --mode lines
